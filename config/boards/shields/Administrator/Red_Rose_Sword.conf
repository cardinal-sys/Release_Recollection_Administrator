# =================================================
# Red_Rose_Sword.conf — 〈赤薔薇の剣〉右手・central
#   Cardinal版 Elucidator.conf を継承
#   旧名 Night_Sky_Sword（2026-09-14改名。詳細は README SYSTEM LOG参照）
# =================================================

# 表示名
CONFIG_ZMK_KEYBOARD_NAME="Red Rose Sword"

# NFC ピンを GPIO として使用（無線干渉防止）
CONFIG_NFCT_PINS_AS_GPIOS=y

# 〈Reflex Boost〉— キースキャンデバウンス短縮
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# Bluetooth 基本・安定化設定
CONFIG_ZMK_BLE=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# 〈Redundant Sigil Cleanup〉— PHY_2M / AUTO_PHY_UPDATE は Zephyr既定が既にy
# （原型Cygnus-S-Lkeymouseが使う古いZephyr v3.5.0+zmk-fixesでも同様にdefault y）のため、
# 明示指定は実効果ゼロ。42キー版〈Cardinal〉に双子同期（2026-09-14実機ソース確認済み）。
# CONFIG_BT_CTLR_PHY_2M=y
# CONFIG_BT_AUTO_PHY_UPDATE=y
# 〈Data Length Sigil Removal〉— Zephyr本家Issue #38782でCONFIG_BT_CTLR_DATA_LENGTH_MAX=250が
# Windows/タブレット/非Snapdragon端末でペアリング失敗(BT_HCI_ERR_CONN_TIMEOUT)を招く既知の
# 互換性問題と判明。本構成の251はほぼ同値。原型にはこの設定自体が存在せず既定(27)のまま。
# 42キー版〈Cardinal〉に双子同期（2026-09-14）。
# CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
# CONFIG_BT_BUF_ACL_RX_SIZE=251
# CONFIG_BT_BUF_ACL_TX_SIZE=251

# 〈Bandwidth Surge〉— BLE TX/RX バッファ増量
CONFIG_BT_BUF_ACL_TX_COUNT=10
CONFIG_BT_BUF_EVT_RX_COUNT=16

# 接続パラメータ（左右で完全一致させる）
# BT_GAP_AUTO_UPDATE_CONN_PARAMS は Zephyr既定が既にyのため明示不要（撤去しても無変化）。
# CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y
# 〈Conn Param Timeout Sigil Removal〉— Zephyr既定は5000ms（Bluetooth Core仕様
# Core 4.2 Vol 3, Part C, 9.3.12.2「Peripheralは接続確立後5秒間は接続パラメータ更新
# 手続きを行うべきではない」に準拠）。本構成は1000msへ短縮しており仕様違反。出典元は
# ZMK本家Issue #3381（sub-7.5ms低遅延スプリットリンク向けレシピ、投稿者自身が
# 「Bluetoothスペック非準拠、Zephyrデバイス間のみで機能する」と明記）―― ホスト向け
# 接続への誤転用だった疑い。新規ペアリング不調の切り分けのため既定5秒へ委ねる。
# 42キー版〈Cardinal〉に双子同期（2026-09-14、実機検証でMac/iPad1・2台目のペア成功確認済み）。
# CONFIG_BT_CONN_PARAM_UPDATE_TIMEOUT=1000
# ZMK既定値は30（データが無い接続イベントを最大30回までスキップ可）。
# 0（毎接続イベント必須応答）に上書きしていたため、ホストのBLEスタックが
# アイドル時も休めず常時稼働 — PC側が他の処理（ブラウザ等）で混み合うと
# キー入力・トレーラボール移動が両方遅延する症状の主要容疑。
# 42キー版〈Cardinal〉の〈Idle Tax Removal〉（2026-09-12）に双子同期。実機検証済み。
# 原型 Cygnus-S-Lkeymouse はこの設定自体が存在せず既定30のまま。
# CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
# 単位は 10ms（Zephyr: "supervision timeout in 10ms units"）。1000 = 10 秒。
# Apple Accessory Design Guidelines の上限 6 秒を超えて違反していた。
# 42キー版〈Cardinal〉の〈Timeout Sigil Removal〉（2026-09-11）に双子同期。
# iPadOS で2個目以降のプロファイルが「一度は繋がるがすぐ切断される」症状の切り分けとして、
# 設定ごと撤去しZephyr既定へ委ねる実験。42キー版では実機検証済み。
# CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=1000
# 接続インターバル範囲: MIN 7.5ms (Win/Android 最速) ～ MAX 15ms (Apple HID 互換上限)
# 固定 6/6 だと Apple BLE が範囲狭すぎとして拒否し ≈30ms に転落するため範囲指定で 15ms を引き出す
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12

# スプリット接続パラメータ（Left-Right 間）
CONFIG_ZMK_SPLIT_BLE_PREF_LATENCY=0
CONFIG_ZMK_SPLIT_BLE_PREF_TIMEOUT=1000

# 最大接続数（プロファイル数 5 + スプリット相方 1 = 6）
# ZMK central は ZMK_BLE_PROFILE_COUNT = BT_MAX_PAIRED - PERIPHERALS で
# 利用可能 profile 数を決定するため、BT_SEL 0..4 全てを生かすには 6 必須。
# ZMK upstream の split central 既定値と一致。
CONFIG_BT_MAX_CONN=6
CONFIG_BT_MAX_PAIRED=6

# ポインティングデバイス（トラックボール）共通設定
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y
CONFIG_ZMK_MOUSE=y

# SPI and input subsystem
CONFIG_SPI=y
CONFIG_INPUT=y

# PMW3610 trackball sensor (cardinal-sys alt driver)
CONFIG_PMW3610_ALT=y
CONFIG_PMW3610_ALT_POLLING_RATE_125=y
CONFIG_PMW3610_ALT_RUN_DOWNSHIFT_TIME_MS=3000
CONFIG_PMW3610_ALT_REST1_SAMPLE_TIME_MS=10
CONFIG_PMW3610_ALT_MOVEMENT_THRESHOLD=0
CONFIG_PMW3610_ALT_SMART_ALGORITHM=y
CONFIG_PMW3610_ALT_INVERT_Y=y
CONFIG_PMW3610_ALT_INVERT_SCROLL_Y=y
CONFIG_PMW3610_ALT_SNIPE_CPI_DIVIDOR=4

# ポインタ加速設定
CONFIG_ZMK_INPUT_PROCESSOR_ACCELERATION=y
CONFIG_INPUT_PROCESSOR_ACCEL_LEVEL_SIMPLE=y
CONFIG_INPUT_PROCESSOR_ACCEL_PRESET_HIGH_SENS_TRACKBALL=y

# スリープ・Insomnia（寝落ち防止）設定
CONFIG_ZMK_IDLE_TIMEOUT=300000
# 〈Deep Sleep Sigil Removal〉— ZMK本家Issue #3195「Central side does not wake from
# sleep when ZMK Studio is enabled (Zephyr 4.1)」の既知バグ条件（CONFIG_ZMK_STUDIO=y +
# CONFIG_ZMK_SLEEP=y、本構成が固定するZephyrはちょうど4.1.0）に一致していたため撤去。
# 原型Cygnus-S-LkeymouseもCONFIG_ZMK_SLEEP自体を設定しておらず既定（Deep Sleep無効）
# のまま。Studioは使い続けたいためDeep Sleep側を撤去し原型と同じ既定挙動へ戻す。
# 42キー版〈Cardinal〉に双子同期（2026-09-14）。IDLE（軽量スリープ、5分）は維持。
# CONFIG_ZMK_SLEEP=y
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000
# 〈Wakeful Vigil Suspension〉— 姉妹リポジトリ Cardinal（42キー版）でバッテリー%が
# 「下がって、また戻る」変動の一因と実機確認済みのため同時対応。常時ACTIVE状態を
# 維持する副作用として battery.c のバッテリー再測定タイマー（既定60秒毎）がIDLE化で
# 止まらず24時間回り続け、force-awake等による瞬間的な電圧沈み込みを捕捉する頻度を
# 上げていた。BLE切断が再発したら本行を戻す。
# CONFIG_ZMK_INSOMNIA_PING_INTERVAL=3000
# CONFIG_ZMK_INSOMNIA_PING_ON_START=y

# バッテリー報告（右側が左側の残量をフェッチする設定）
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# 〈Live Sync Conduit〉— ZMK Studio 有効化
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_USB=y
CONFIG_USB_HID_POLL_INTERVAL_MS=4

# RGB LED Widget
CONFIG_RGBLED_WIDGET=y
CONFIG_RGBLED_WIDGET_SHOW_LAYER_COLORS=y
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=50
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_LOW=20
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_CRITICAL=10
CONFIG_RGBLED_WIDGET_INTERVAL_MS=250
# 〈Peripheral Echo Silencing〉— 姉妹リポジトリ Cardinal（42キー版）で
# 起動時に「自分の残量→左手の残量」と2回点滅し、split BLE 再接続が
# widget.cの待機時間（約2.25秒）に間に合わないと実残量と無関係な
# 「missing」色（既定マゼンタ）が混ざる不具合と確認済みのため撤去。
# CONFIG_RGBLED_WIDGET_BATTERY_SHOW_PERIPHERALS=y

# LED Layer Colors (0-16)
CONFIG_RGBLED_WIDGET_LAYER_0_COLOR=0
CONFIG_RGBLED_WIDGET_LAYER_1_COLOR=1
CONFIG_RGBLED_WIDGET_LAYER_2_COLOR=2
CONFIG_RGBLED_WIDGET_LAYER_3_COLOR=3
CONFIG_RGBLED_WIDGET_LAYER_4_COLOR=4
CONFIG_RGBLED_WIDGET_LAYER_5_COLOR=5
CONFIG_RGBLED_WIDGET_LAYER_6_COLOR=6
CONFIG_RGBLED_WIDGET_LAYER_7_COLOR=3
CONFIG_RGBLED_WIDGET_LAYER_8_COLOR=4
CONFIG_RGBLED_WIDGET_LAYER_9_COLOR=5
CONFIG_RGBLED_WIDGET_LAYER_10_COLOR=0
CONFIG_RGBLED_WIDGET_LAYER_11_COLOR=6
CONFIG_RGBLED_WIDGET_LAYER_12_COLOR=7
CONFIG_RGBLED_WIDGET_LAYER_13_COLOR=1
CONFIG_RGBLED_WIDGET_LAYER_14_COLOR=2
CONFIG_RGBLED_WIDGET_LAYER_15_COLOR=7
CONFIG_RGBLED_WIDGET_LAYER_16_COLOR=3

# Boot Retention
CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOT_MODE=y

# ログサブシステム（ホスト BLE 接続維持に必須）
CONFIG_ZMK_USB_LOGGING=n
CONFIG_LOG=y
